name: Refresh lottery news

# GLO draws publish ~08:30 UTC (15:30 ICT) on the 1st/16th.
# Crontab seeds news.json before the draw, then polls every 30 min
# 08:00–12:00 UTC to catch fresh results within ~30 min of publish.
on:
  schedule:
    - cron: "0 7 1,16 * *"
    - cron: "0,30 8,9,10,11 1,16 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scrape-news.mjs news.json
      - name: Validate scraped news payload schema
        run: |
          node -e "
          const fs = require('fs');
          const news = JSON.parse(fs.readFileSync('news.json', 'utf8'));
          if (!news || typeof news !== 'object') {
            throw new Error('news.json must be a JSON object');
          }
          if (!Array.isArray(news.suggestedNumbers)) {
            throw new Error('news.json must include suggestedNumbers as array');
          }
          const isDigits = (arr) =>
            Array.isArray(arr) &&
            (arr.length === 2 || arr.length === 3 || arr.length === 6) &&
            arr.every((digit) => Number.isInteger(Number(digit)) && Number(digit) >= 0 && Number(digit) <= 9);
          const invalid = [];
          news.suggestedNumbers.forEach((suggestion, index) => {
            if (
              !suggestion ||
              typeof suggestion !== 'object' ||
              !isDigits(suggestion.digits) ||
              typeof suggestion.weight !== 'number' ||
              !Number.isFinite(suggestion.weight) ||
              suggestion.weight <= 0
            ) {
              invalid.push(index);
            }
          });
          if (invalid.length > 0) {
            throw new Error(`news.json has ${invalid.length} malformed suggestion(s): ${invalid.slice(0, 20).join(',')}`);
          }
          console.log(`news.json schema valid with ${news.suggestedNumbers.length} suggestions`);
          "
      - name: Commit if changed
        run: |
          if git diff --quiet -- news.json; then
            echo "news.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "🤖 Refresh lottery news.json"
          git push
      - name: Watchdog — fail run if scraper produced zero suggestions
        # Catches silent scraper failure (WAF, layout change, 5xx) that would otherwise commit an empty news.json and keep the run green.
        if: always()
        run: |
          set -e
          COUNT=$(node -e "const n=require('./news.json');console.log(Array.isArray(n.suggestedNumbers)?n.suggestedNumbers.length:0)")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Scraper produced 0 suggestions — news.json contains no suggestedNumbers. The Thaiger homepage layout may have changed or the request was blocked. Site will fall back to pure-history mode until this is fixed."
            exit 1
          fi
          echo "Watchdog OK: $COUNT suggestions in news.json"
