name: Refresh lottery news

on:
  schedule:
    - cron: "0 5 1,16 * *"
    - cron: "0 */2 1,16 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/scrape-news.mjs news.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- news.json; then
            echo "news.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "🤖 Refresh lottery news.json"
          git push